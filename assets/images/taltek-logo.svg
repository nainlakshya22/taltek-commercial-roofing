<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 64" fill="none" role="img" aria-label="TALTEK Commercial Roofing Logo">
  <defs>
    <linearGradient id="taltekOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E59" />
      <stop offset="100%" stop-color="#D87535" />
    </linearGradient>
  </defs>
  <!-- Architectural Emblem -->
  <g transform="translate(6, 6)">
    <!-- Base industrial angle / structural truss -->
    <path d="M 4 48 L 26 8 L 48 48 Z" stroke="#4B5460" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <path d="M 12 48 L 26 22 L 40 48" stroke="#3D444E" stroke-width="1.8" fill="none"/>
    <!-- Precision Copper Peak / Roof Membrane Chevron -->
    <path d="M 16 34 L 26 14 L 36 34" stroke="url(#taltekOrange)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="14" r="3.2" fill="#FF9E59" />
    <!-- Horizontal datum bar -->
    <line x1="0" y1="48" x2="52" y2="48" stroke="url(#taltekOrange)" stroke-width="2.8" stroke-linecap="square"/>
    <!-- Precision ticks -->
    <line x1="26" y1="48" x2="26" y2="53" stroke="#FF9E59" stroke-width="2.2"/>
    <line x1="6" y1="48" x2="6" y2="51" stroke="#A7ADB2" stroke-width="1.6"/>
    <line x1="46" y1="48" x2="46" y2="51" stroke="#A7ADB2" stroke-width="1.6"/>
  </g>
  <!-- Wordmark -->
  <text x="70" y="33" font-family="'Inter', 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="29" letter-spacing="3" fill="#FFFFFF">TALTEK</text>
  <text x="71" y="52" font-family="'Inter', 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5" fill="#FFFFFF">COMMERCIAL ROOFING</text>
  <circle cx="248" cy="48" r="2.5" fill="#FF9E59"/>
  <text x="258" y="52" font-family="'Inter', 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.5" fill="#FF9E59">EST. 2009</text>
</svg>