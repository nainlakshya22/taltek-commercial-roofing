<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" role="img" aria-label="Manufacturer and Safety Accreditations">
  <!-- Johns Manville Peak Advantage -->
  <g transform="translate(40, 40)">
    <rect width="160" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="80" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#F5F4F0" text-anchor="middle">JM</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#D87535" text-anchor="middle">PEAK ADVANTAGE</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#A7ADB2" text-anchor="middle">Johns Manville Certified</text>
    <line x1="40" y1="105" x2="120" y2="105" stroke="#29303A"/>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#F5F4F0" text-anchor="middle">TPO &amp; EPDM</text>
  </g>

  <!-- GAF Commercial -->
  <g transform="translate(240, 40)">
    <rect width="160" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="80" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#F5F4F0" text-anchor="middle">GAF</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#D87535" text-anchor="middle">COMMERCIAL</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#A7ADB2" text-anchor="middle">Certified Contractor</text>
    <line x1="40" y1="105" x2="120" y2="105" stroke="#29303A"/>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#F5F4F0" text-anchor="middle">EVERGUARD TPO</text>
  </g>

  <!-- Elevate (Formerly Firestone) -->
  <g transform="translate(440, 40)">
    <rect width="160" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="80" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="19" fill="#F5F4F0" text-anchor="middle">ELEVATE</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#D87535" text-anchor="middle">FIRESTONE ROOFING</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#A7ADB2" text-anchor="middle">RubberGard &amp; UltraPly</text>
    <line x1="40" y1="105" x2="120" y2="105" stroke="#29303A"/>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#F5F4F0" text-anchor="middle">CERTIFIED INSTALLER</text>
  </g>

  <!-- CertainTeed & Versico Commercial -->
  <g transform="translate(640, 40)">
    <rect width="160" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="80" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#F5F4F0" text-anchor="middle">CERTAINTEED</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#D87535" text-anchor="middle">&amp; VERSICO ROOFING</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#A7ADB2" text-anchor="middle">Single-Ply &amp; Low-Slope</text>
    <line x1="40" y1="105" x2="120" y2="105" stroke="#29303A"/>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#F5F4F0" text-anchor="middle">COMMERCIAL PARTNER</text>
  </g>

  <!-- OSHA 10 & 30 Safety Program -->
  <g transform="translate(840, 40)">
    <rect width="160" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="80" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#10B981" text-anchor="middle">OSHA 10 / 30</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#F5F4F0" text-anchor="middle">FIELD SAFETY STANDARD</text>
    <text x="80" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#A7ADB2" text-anchor="middle">Daily Toolbox Talks</text>
    <line x1="40" y1="105" x2="120" y2="105" stroke="#29303A"/>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#10B981" text-anchor="middle">100% FIELD COMPLIANCE</text>
  </g>

  <!-- Better Business Bureau Accredited Since 2009 -->
  <g transform="translate(1040, 40)">
    <rect width="140" height="150" rx="8" fill="#14181D" stroke="#29303A" stroke-width="1.5"/>
    <text x="70" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#F5F4F0" text-anchor="middle">BBB</text>
    <text x="70" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#D87535" text-anchor="middle">A+ RATING</text>
    <text x="70" y="90" font-family="'Inter', sans-serif" font-size="9.5" fill="#A7ADB2" text-anchor="middle">Accredited Since 2009</text>
    <line x1="30" y1="105" x2="110" y2="105" stroke="#29303A"/>
    <text x="70" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#F5F4F0" text-anchor="middle">VERIFIED STANDING</text>
  </g>
