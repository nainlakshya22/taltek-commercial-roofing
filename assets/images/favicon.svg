<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="TALTEK Emblem">
  <defs>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E59" />
      <stop offset="100%" stop-color="#D87535" />
    </linearGradient>
  </defs>
  <!-- Background Badge: Luxury Industrial Charcoal -->
  <rect width="64" height="64" rx="14" fill="#111315"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#252A30" stroke-width="1.5" fill="none"/>
  
  <!-- Architectural Emblem Centered -->
  <g transform="translate(6, 6)">
    <!-- Base structural truss -->
    <path d="M 4 44 L 26 8 L 48 44 Z" stroke="#525B66" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <path d="M 12 44 L 26 21 L 40 44" stroke="#404750" stroke-width="1.8" fill="none"/>
    <!-- Precision Copper Peak / Roof Chevron -->
    <path d="M 16 32 L 26 14 L 36 32" stroke="url(#favOrange)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="14" r="3.2" fill="#FF9E59" />
    <!-- Horizontal datum bar -->
    <line x1="0" y1="44" x2="52" y2="44" stroke="url(#favOrange)" stroke-width="2.8" stroke-linecap="square"/>
    <!-- Center tick -->
    <line x1="26" y1="44" x2="26" y2="49" stroke="#FF9E59" stroke-width="2.2"/>
    <!-- Side ticks -->
    <line x1="6" y1="44" x2="6" y2="47" stroke="#A7ADB2" stroke-width="1.8"/>
    <line x1="46" y1="44" x2="46" y2="47" stroke="#A7ADB2" stroke-width="1.8"/>
  </g>
</svg>