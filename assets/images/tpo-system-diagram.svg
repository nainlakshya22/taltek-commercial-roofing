<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="auto" fill="none" role="img" aria-label="TPO Single-Ply Commercial Roofing System Layer Cross-Section">
  <!-- Outer Card Container -->
  <rect width="640" height="400" rx="12" fill="#0C0F12" stroke="#252D37" stroke-width="2"/>
  
  <!-- Diagram Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="14" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="0.5" fill="#FFFFFF">TPO ROOFING SYSTEM // MULTI-LAYER ASSEMBLY</text>
    <text x="0" y="32" font-family="'Inter', monospace" font-weight="800" font-size="11" letter-spacing="1.5" fill="#FF9E59">THERMOPLASTIC POLYOLEFIN CLASS 1 RATED SYSTEM</text>
  </g>
  
  <!-- Top Divider -->
  <line x1="24" y1="62" x2="616" y2="62" stroke="#222A35" stroke-width="1.5"/>

  <!-- FASTENER ASSEMBLY (Dedicated Column on Right) -->
  <g transform="translate(562, 74)">
    <!-- Fastener Top Stress Plate -->
    <rect x="-16" y="0" width="32" height="9" rx="2.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="0" cy="4.5" r="2" fill="#D87535"/>
    
    <!-- Fastener Heavy Shaft (Dashed) -->
    <line x1="0" y1="9" x2="0" y2="252" stroke="#FF9E59" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- Drill Point into Steel Deck -->
    <path d="M -4 252 L 0 264 L 4 252 Z" fill="#FF9E59"/>
    
    <!-- Fastener Callout Label -->
    <g transform="translate(0, 276)">
      <rect x="-38" y="0" width="76" height="28" rx="4" fill="#141922" stroke="#D87535" stroke-width="1.2"/>
      <text x="0" y="11" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#FF9E59" text-anchor="middle" letter-spacing="0.5">MECHANICAL</text>
      <text x="0" y="22" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FASTENER</text>
    </g>
  </g>

  <!-- LAYER 1: TPO Membrane (Top Layer) -->
  <g transform="translate(24, 74)">
    <rect width="488" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="8" y="8" width="32" height="30" rx="4" fill="#0F172A"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="48" y="22" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" fill="#0F172A" letter-spacing="0.3">WHITE TPO MEMBRANE</text>
    <text x="48" y="37" font-family="'Inter', monospace" font-weight="800" font-size="10.5" fill="#475569">60-MIL / 80-MIL // ROBOTIC HEAT-WELDED SEAMS</text>
  </g>

  <!-- LAYER 2: Gypsum Cover Board -->
  <g transform="translate(24, 126)">
    <rect width="488" height="46" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="8" y="8" width="32" height="30" rx="4" fill="#0F172A"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FF9E59" text-anchor="middle">02</text>
    <text x="48" y="22" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="0.3">HIGH-DENSITY GYPSUM COVER BOARD</text>
    <text x="48" y="37" font-family="'Inter', monospace" font-weight="800" font-size="10.5" fill="#CBD5E1">DENSDECK PRIME // HAIL &amp; PUNCTURE RESISTANT</text>
  </g>

  <!-- LAYER 3: Polyiso Insulation Layers -->
  <g transform="translate(24, 178)">
    <rect width="488" height="54" rx="6" fill="#182232" stroke="#2B3B52" stroke-width="1.5"/>
    <rect x="8" y="12" width="32" height="30" rx="4" fill="#0F172A"/>
    <text x="24" y="33" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FF9E59" text-anchor="middle">03</text>
    <text x="48" y="23" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="0.3">TAPERED POLYISO INSULATION LAYERS</text>
    <text x="48" y="42" font-family="'Inter', monospace" font-weight="900" font-size="11" fill="#FF9E59">CONTINUOUS R-30.0 TO R-35.0 // ASHRAE 90.1 COMPLIANT</text>
  </g>

  <!-- LAYER 4: Vapor Barrier -->
  <g transform="translate(24, 238)">
    <rect width="488" height="44" rx="6" fill="#D87535" stroke="#F08A46" stroke-width="1.5"/>
    <rect x="8" y="7" width="32" height="30" rx="4" fill="#0F172A"/>
    <text x="24" y="28" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FF9E59" text-anchor="middle">04</text>
    <text x="48" y="21" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="13.5" fill="#FFFFFF" letter-spacing="0.3">SELF-ADHERING VAPOR RETARDER BARRIER</text>
    <text x="48" y="35" font-family="'Inter', monospace" font-weight="800" font-size="10.5" fill="#14181F">MONOLITHIC AIR &amp; HUMIDITY SEAL // ZERO PERM</text>
  </g>

  <!-- LAYER 5: Structural Steel Deck -->
  <g transform="translate(24, 288)">
    <rect width="488" height="52" rx="6" fill="#141920" stroke="#252F3D" stroke-width="1.5"/>
    <rect x="8" y="11" width="32" height="30" rx="4" fill="#0F172A"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#94A3B8" text-anchor="middle">05</text>
    <text x="48" y="22" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="13.5" fill="#FFFFFF" letter-spacing="0.3">STRUCTURAL STEEL ROOF DECK</text>
    <text x="48" y="36" font-family="'Inter', monospace" font-weight="800" font-size="10.5" fill="#94A3B8">22-GAUGE TYPE B CORRUGATED SUBSTRATE</text>
    <!-- Corrugated Steel Wave -->
    <path d="M 280 43 L 305 43 L 315 48 L 335 48 L 345 43 L 370 43 L 380 48 L 400 48 L 410 43 L 435 43 L 445 48 L 465 48 L 475 43 L 485 43" stroke="#475569" stroke-width="2" fill="none"/>
  </g>

  <!-- Bottom Divider -->
  <line x1="24" y1="352" x2="616" y2="352" stroke="#222A35" stroke-width="1.5"/>

  <!-- Bottom Specification Footer -->
  <g transform="translate(24, 376)">
    <circle cx="5" cy="-4" r="3" fill="#D87535"/>
    <text x="16" y="0" font-family="'Inter', monospace" font-weight="800" font-size="11" fill="#CBD5E1" letter-spacing="0.5">SPECIFICATION: ASTM D6878 // UL CLASS A FIRE RATING // FM 1-90 APPROVED</text>
  </g>
</svg>